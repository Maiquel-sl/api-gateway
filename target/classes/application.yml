server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Customer Service Route
        - id: customer-service-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: bankServiceCB
                fallbackUri: forward:/fallback/customers

        # 2. Account Service Route
        - id: account-service-route
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: bankServiceCB
                fallbackUri: forward:/fallback/accounts

        # 3. Credit Service Route
        - id: credit-service-route
          uri: lb://CREDIT-SERVICE
          predicates:
            - Path=/api/credits/**
          filters:
            - name: CircuitBreaker
              args:
                name: bankServiceCB
                fallbackUri: forward:/fallback/credits

        # 4. Transaction Service Route
        - id: transaction-service-route
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: bankServiceCB
                fallbackUri: forward:/fallback/transactions

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
